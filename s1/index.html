<!doctype html>
<html lang="es">
<head>

</head>
<body>
<div class="app">
  <div id="escena">
    <div id="fondo"></div>
    <canvas id="vida" aria-hidden="true"></canvas>
    <div id="efecto" aria-hidden="true"></div>
    <div id="capas"></div>
    <div id="inter"></div>
    <div id="video"></div>
    <div id="blanco" aria-hidden="true"></div>
    <div id="dialogo" aria-live="polite"><span id="dQuien"></span><p id="dTexto"></p><div class="nav"><button id="bCont" class="prim" type="button" disabled>Continuar ▶</button></div></div>
    <div id="barra"></div>
    <div id="cartel"></div>
    <div class="cab">
      <div class="marca"><b id="marcaTit">Transporte 1</b><small id="marcaSub"></small></div>
      <div id="puntos" aria-hidden="true"></div>
      <div class="fila"></div>
    </div>
    <div id="inicio" role="button" tabindex="0" aria-label="Pulsa para empezar la sesión">
      <div class="rueda">
        <svg viewBox="0 0 560 560" aria-hidden="true"><circle cx="280" cy="280" r="270" fill="none" stroke="#63e6ff" stroke-width="2" opacity=".35"/><circle cx="280" cy="280" r="250" fill="none" stroke="#63e6ff" stroke-width="5" stroke-dasharray="4 14" opacity=".7"/><circle cx="280" cy="280" r="226" fill="none" stroke="#ffb547" stroke-width="2" opacity=".5" stroke-dasharray="380 1040" transform="rotate(-90 280 280)"/></svg>
        <span class="sup" id="iSup"></span><span class="hz">220 Hz</span><h1 id="iTit">Transporte 1</h1><span class="sub" id="iSub"></span>
      </div>
      <span class="start">Pulsa para empezar</span>
      <div class="sigue"><button type="button" class="prim" id="bSigue">▶ Seguir donde lo dejaste</button><button type="button" id="bDesde0">↺ Empezar desde el principio</button></div>
      <span class="estado" id="iEstado">Cargando…</span><span class="pista">clic o cualquier tecla</span>
    </div>
  </div>
</div>
<script src="data/recursos.js"></script>
<script src="js/nucleo.js?v=3"></script>

<script src="js/motor.js?v=3"></script>

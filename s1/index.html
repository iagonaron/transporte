<!-- (Iago 5-nov-2026) VOLUNTARIOS · solo con la cuenta Protester: el medallero de gp.lmathome.es abre el portal con «#c=<cuenta>»;
     se guarda en este navegador y se carga el seleccionador de https://gp.lmathome.es/voluntarios/. En hora de clase, al empezar la
     sesión sale «Seleccionar voluntario» con la estética de esta sesión (js/motor.js, arranca). A los alumnos no les hace nada.
     Quitarlo: borrar este bloque. -->
<script>
window.LM_VOL_CONFIG = function () { return { portal: 'transporte', tema: 'trpulsera', engancha: false }; };
(function () {
  try {
    var m = /(?:^#|&)c=([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i.exec(location.hash || ''), c = null, h0 = location.hash;
    if (m) { c = m[1].toLowerCase(); try { localStorage.setItem('lm_vol_cuenta', c); } catch (e) {} }
    else { try { c = localStorage.getItem('lm_vol_cuenta'); } catch (e) {} }
    if (!c) return;
    var s = document.createElement('script'); s.async = true;
    s.src = 'https://gp.lmathome.es/voluntarios/lm-voluntarios.js?h=' + Math.floor(Date.now() / 36e5);
    s.onload = function () {
      var ir = function () { try { if (window.LMVoluntarios) window.LMVoluntarios.monta(window.LM_VOL_CONFIG()); } catch (e) {}
        /* el seleccionador quita «c=» de la dirección; Transporte la necesita para el menú y «Volver al portal»: se repone */
        try { if (m && location.hash !== h0) history.replaceState(history.state, '', location.pathname + location.search + h0); } catch (e) {} };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ir); else ir();
    };
    document.head.appendChild(s);
  } catch (e) {}
})();
</script>

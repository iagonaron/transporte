   a 220 · 440 · 880 · 1760 Hz (octavas). Escenario de 1920×1080 que se escala entero (sin scroll). */

svg.onda{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.anillo{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--cian);background:rgba(6,12,29,.85);box-shadow:0 0 24px var(--cian);pointer-events:none}
.anillo.off{border-color:#4a5b80;box-shadow:none}
.anillo.on::after{content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(99,230,255,.45);animation:late 2.4s ease-out infinite}
@keyframes late{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.6);opacity:0}}
a.nodo{position:absolute;top:800px;width:330px;height:250px;margin-left:-165px;padding:110px 18px 0;text-align:center;text-decoration:none;color:inherit;

<script>
/* al llegar desde una sesión por el teletransporte (?tp=1): un destello blanco que se disuelve */
(function(){ if (!/[?&]tp=1/.test(location.search)) return; var d = document.getElementById('destello'); d.style.transition = 'none'; d.style.opacity = '1';
  try { history.replaceState(history.state, '', location.pathname + location.hash); } catch (e) {}
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ d.style.transition = 'opacity 1.4s ease-out'; d.style.opacity = '0'; }); }); })();
/* los enlaces llevan la cuenta (#c=…) a cada sesión */
[].forEach.call(document.querySelectorAll('a.nodo[data-ir]'), function(a){ a.href = a.getAttribute('data-ir') + location.hash; });
/* el escenario 1920×1080 se escala para caber entero */
function encaja(){ var e=document.getElementById('esc'), k=Math.min(innerWidth/1920, innerHeight/1080); e.style.transform='translate(-50%,-50%) scale('+k.toFixed(4)+')'; }
encaja(); addEventListener('resize', encaja);

/* ambiente sonoro: mar de noche (principal) + ciudad de 2100 (más bajo), en bucle sin cortes (Web Audio).
   Suena desde el primer clic/tecla/toque (o ya, si el navegador lo permite); se recuerda el silencio; se va con fundido al entrar en una sesión. */
(function(){
  var NIVEL = 0.7, ENTRADA = 0.8, SALIDA = 0.8, LS = 'transporte_ambiente';
  var AC = window.AudioContext || window.webkitAudioContext;
  var btn = document.getElementById('amb'), tip = document.getElementById('ambtip');
  var silencio = false;
  try { silencio = localStorage.getItem(LS) === 'off'; } catch (e) {}
  var ctx = null, master = null, capas = 0, entro = false, saliendo = false;

  function pinta(){
    btn.className = silencio ? 'mudo' : '';
    btn.setAttribute('aria-pressed', silencio ? 'true' : 'false');
    btn.setAttribute('aria-label', silencio ? 'Activar el ambiente' : 'Silenciar el ambiente');
    tip.textContent = silencio ? 'Activar ambiente' : 'Silenciar ambiente';
    btn.setAttribute('data-estado', silencio ? 'silencio' : (ctx && ctx.state === 'running' ? 'sonando' : 'espera'));
  }
  function rampa(a, tau){ if (!master) return; var t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.setTargetAtTime(a, t, tau); }
  /* fundido de entrada (~2,5 s): constante de tiempo 0,8 s */
  function entra(){ if (!ctx || ctx.state !== 'running' || silencio || saliendo) return; entro = true; rampa(NIVEL, ENTRADA); pinta(); }
  function capa(url, nivel){
    fetch(url).then(function(r){ return r.arrayBuffer(); }).then(function(b){
      return new Promise(function(ok, ko){ ctx.decodeAudioData(b, ok, ko); });
    }).then(function(buf){
      var s = ctx.createBufferSource(), g = ctx.createGain();
      s.buffer = buf; s.loop = true; g.gain.value = 0; s.connect(g); g.connect(master); s.start(0);
      g.gain.setTargetAtTime(nivel, ctx.currentTime, 0.2); capas++;
    }).catch(function(){});
  }
  function monta(){
    if (ctx || !AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    ctx.onstatechange = function(){ if (ctx.state === 'running') entra(); pinta(); };
    capa('s1/sfx/menu_mar.mp3', 0.8);
    capa('s1/sfx/menu_ciudad.mp3', 0.34);
    if (ctx.state === 'running') entra();
    else { try { ctx.resume().catch(function(){}); } catch (e) {} }
  }
  function gesto(ev){
    if (silencio || (ev && btn.contains(ev.target))) return;
    monta();
    if (ctx && ctx.state !== 'running') { try { ctx.resume().then(entra, function(){}); } catch (e) {} } else entra();
  }
  ['pointerdown', 'keydown', 'touchstart', 'click'].forEach(function(n){ document.addEventListener(n, gesto, true); });

  btn.addEventListener('click', function(){
    silencio = !silencio;
    try { localStorage.setItem(LS, silencio ? 'off' : 'on'); } catch (e) {}
    monta();
    if (silencio) rampa(0, 0.15);
    else if (ctx) { if (ctx.state !== 'running') { try { ctx.resume().then(entra, function(){}); } catch (e) {} } else entra(); }
    pinta();
  });

  /* al entrar en una sesión: el ambiente se va con fundido (~0,8 s) y se navega sin pasar de 1 s */
  document.addEventListener('click', function(ev){
    var a = ev.target.closest ? ev.target.closest('a.nodo[href]') : null;
    if (!a || ev.defaultPrevented || ev.button || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    if (!ctx || ctx.state !== 'running' || silencio || !master) return;
    ev.preventDefault(); saliendo = true;
    var t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + SALIDA);
    var url = a.href; setTimeout(function(){ location.href = url; }, SALIDA * 1000);
  });
  /* volver con «atrás» (página en caché): el ambiente vuelve con fundido */
  addEventListener('pageshow', function(ev){ if (ev.persisted) { saliendo = false; entra(); } });
  /* pestaña oculta: en pausa; al volver, continúa */
  document.addEventListener('visibilitychange', function(){
    if (!ctx) return;
    if (document.hidden) { try { ctx.suspend(); } catch (e) {} }
    else if (!silencio && !saliendo) { try { ctx.resume(); } catch (e) {} }
  });

  pinta();
  if (!silencio) monta(); /* si el navegador deja sonar sin gesto, ya suena (también al volver del teletransporte, ?tp=1) */
})();
</script>
